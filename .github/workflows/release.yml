name: Release

# Run by hand: Actions, Release, Run workflow. Builds the extension from the Seneschal.Sdk package, tags the commit as v<version>
# (the version in extension.json) and puts loopup-dev-env.snx on a GitHub Release, ready to import in the Extension Manager.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark as a pre-release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('Seneschal.LoopupDevEnv/extension.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Build
        run: dotnet build Seneschal.LoopupDevEnv -c Release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ] || [[ "$VERSION" == *-* ]]; then flags="--prerelease"; fi
          gh release create "v$VERSION" Seneschal.LoopupDevEnv/artifacts/packages/loopup-dev-env.snx \
            --target "$GITHUB_SHA" --title "LoopUp Dev Environment $VERSION" --generate-notes $flags
