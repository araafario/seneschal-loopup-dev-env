name: CI

# Checks that the extension builds from the SDK package and packs. It publishes nothing: a release is made by hand with the Release workflow.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Seneschal.LoopupDevEnv -c Release

      - name: Check the package
        run: test -f Seneschal.LoopupDevEnv/artifacts/packages/loopup-dev-env.snx
